name: Daily email
on:
  schedule:
    - cron: "37 3 * * *"     # 03:37 UTC every day
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/fetch_news.py
      - name: Build and send email (skipped if SMTP secrets are missing)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -z "$SMTP_HOST" ]; then
            echo "::warning::SMTP_HOST secret not set; email not sent"
          fi
          python3 scripts/build_email.py
